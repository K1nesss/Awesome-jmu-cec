# 校验 + 构建（不部署）（PLAN.md §8.3）
# - pull_request：红色即拦截合并（死链、Markdown/Vue 语法错、构建失败给出文件 + 行号）
# - push main：维护者直推后的自检（不拦截；CF 构建失败不部署，线上保留上一版）
name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
# 注意：concurrency 用块式写法——流式映射 `{ group: ${{ ... }} }` 内含 `{{ }}` 会被工作流解析器拒绝（M0 实测踩坑）
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
        # 构建时读取提问与贡献者（scripts/github.mjs）；用本次运行自带的令牌，避免未登录的频率限制
        env:
          GITHUB_READ_TOKEN: ${{ github.token }}
      - run: node scripts/verify-build.mjs
