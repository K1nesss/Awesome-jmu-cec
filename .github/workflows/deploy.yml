# 部署：push main 即构建并发布到 GitHub Pages（PLAN.md §8.2）
# 注意：action 版本纪律见 PLAN.md §8.4——落地时用 `gh api repos/actions/<name>/releases/latest` 核对当前 major
name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }                 # 完整 git 历史，「最后更新于」才有值
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test                            # node --test tests/（分词器回归）
      - run: npm run build                       # check（中文注解，不阻断）+ vitepress build（死链=失败）
      - run: node scripts/verify-build.mjs       # dist / base 前缀 / 搜索索引冒烟断言
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: docs/.vitepress/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
