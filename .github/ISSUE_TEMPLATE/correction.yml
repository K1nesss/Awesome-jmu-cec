name: 报告错误
description: 文章里的信息有误或已经过时
title: "[纠错] "
labels: ["纠错"]
body:
  - type: markdown
    attributes:
      value: 谢谢你帮忙纠错！从文章底部的「报告错误」按钮进来时，下面的页面地址已经填好了。
  - type: input
    id: page
    attributes:
      label: 页面地址
      placeholder: https://…
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 哪里有问题
      description: 引用原文中有误的那一句，再写正确的情况。
      placeholder: |
        原文：「……」
        实际：……
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 依据（可选）
      description: 学院通知、官网链接，或者「本人 2026 年亲历」。有依据的纠错会处理得更快。
  - type: input
    id: file
    attributes:
      label: 源文件（自动填写，不用改）
