# ============================================================
# 重要日期（「重要日期」页面、首页「下一个节点」、日历订阅 calendar.ics 都读这个文件）
#
# 每一项的写法：
#   - title: 事件名称（必填）
#     date: 2026-10-15          开始日期（必填，年-月-日）
#     end: 2026-10-24           结束日期（可选，单日事件不写）
#     category: kaoyan          所属板块目录名（可选，见投稿页「板块与目录对照」）
#     note: 补充说明            （可选）
#     source: https://...       官方来源链接（强烈建议填写）
#     tentative: 预计 10 月中旬  日期还没正式公布时填写：页面显示这段文字、不显示倒计时，也不会写进日历订阅
#
# 规则：只写有官方来源的日期；学校、学院自定的日期请附上通知链接。过期的条目不用删，页面会自动收进「已结束」。
# ============================================================

