# 校园地图的地点：人工修正与补充。
# 自动生成的地点来自 OpenStreetMap（docs/map/places.generated.json，由 npm run map:build 生成，不要手改）。
# 这里的修改优先于自动结果，构建时合并。
#
# 修改已有地点：用 match 指定（地图上的原名，或 places.generated.json 里的 id），再写要改的字段：
#   name: 新名字
#   cat: 分类（教学 / 宿舍 / 食堂 / 图书馆 / 运动 / 生活 / 其他）
#   aliases: [别名1, 别名2]   搜索时也能用这些词找到，例如学院名、俗称
#   note: 一句话介绍          显示在地点卡片上
#   links: [/college/]        相关文章（站内路径）
#   priority: 1               标签显示优先级：1 = 缩小地图时也显示，2 = 放大后显示，3 = 只在最近时显示
#   hide: true                不在地图标签和列表里显示
#
# 新增地点（OpenStreetMap 里没有的，例如某个校门）：不写 match，写 name、cat、lon、lat。
#   经纬度用 WGS-84（手机 GPS 读数即可；从高德、百度地图复制的坐标有偏移，不能直接用）。
#
# 只写公开、确定的信息。名字和位置有疑问时，先在问答页确认。

- match: 集美大学庄重文体育场拼多多快递驿站
  name: 庄重文体育场快递驿站
